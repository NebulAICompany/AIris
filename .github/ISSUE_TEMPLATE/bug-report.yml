name: Bug report
description: Report a bug in AIris. To report a security issue, use SECURITY.md instead.
labels: ["bug"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report.

        Do not include API keys, `.env` contents, uploaded documents, or exploit details. Security issues go through SECURITY.md.

        Check these before submitting:

        * [README](https://github.com/NebulAICompany/AIris/blob/HEAD/README.md)
        * [ARCHITECTURE](https://github.com/NebulAICompany/AIris/blob/HEAD/ARCHITECTURE.md)
        * GitHub search for a similar issue
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      description: Please confirm and check all the following options.
      options:
        - label: This is a bug, not a usage question.
          required: true
        - label: I added a clear and descriptive title that summarizes this issue.
          required: true
        - label: I used the GitHub search to find a similar issue and did not find it.
          required: true
        - label: I am sure that this is a bug in AIris rather than my local configuration.
          required: true
        - label: I posted a self-contained, minimal, reproducible example. A maintainer can follow it as written.
          required: true
  - type: textarea
    id: related
    validations:
      required: false
    attributes:
      label: Related issues / PRs
      description: If this bug is related to existing issues or pull requests, link them here.
      placeholder: |
        * e.g. #123, #456
  - type: textarea
    id: reproduction
    validations:
      required: true
    attributes:
      label: Reproduction steps
      description: |
        Add a self-contained, minimal, reproducible example.

        If a maintainer can follow it and see the failure immediately, the report is much more useful.

        Avoid screenshots as the only repro. Reduce the steps to the minimum required.
        Do not paste secrets or document contents.
  - type: textarea
    id: error
    attributes:
      label: Error message and stack trace (if applicable)
      description: Copy the redacted terminal or UI error. This will be formatted as a shell block.
      render: shell
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you are doing, what you expect, and what happens instead.
      placeholder: |
        * I am trying to do X.
        * I expect Y.
        * Instead, it does Z.
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System info
      description: OS, Python version, Node.js version, and whether the path called a paid provider (names only).
      placeholder: |
        OS: Windows 11
        Python: 3.11
        Node.js: 22.12.0
        Providers: none / Anthropic, OpenAI, ...
    validations:
      required: true
