<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" />
  
  <!-- Brain icon -->
  <g transform="translate(128, 128)">
    <!-- Left hemisphere -->
    <path d="M-30,-40 C-50,-40 -60,-20 -60,0 C-60,20 -50,40 -30,40 C-20,40 -10,30 -10,20 L-10,-20 C-10,-30 -20,-40 -30,-40 Z" 
          fill="url(#brainGradient)" stroke="none"/>
    
    <!-- Right hemisphere -->
    <path d="M30,-40 C50,-40 60,-20 60,0 C60,20 50,40 30,40 C20,40 10,30 10,20 L10,-20 C10,-30 20,-40 30,-40 Z" 
          fill="url(#brainGradient)" stroke="none"/>
    
    <!-- Brain details -->
    <path d="M-25,-20 Q-15,-15 -25,-10 Q-35,-15 -25,-20 Z" fill="#cbd5e1" opacity="0.6"/>
    <path d="M25,-20 Q35,-15 25,-10 Q15,-15 25,-20 Z" fill="#cbd5e1" opacity="0.6"/>
    <path d="M-20,10 Q-10,15 -20,20 Q-30,15 -20,10 Z" fill="#cbd5e1" opacity="0.6"/>
    <path d="M20,10 Q30,15 20,20 Q10,15 20,10 Z" fill="#cbd5e1" opacity="0.6"/>
    
    <!-- Neural connections -->
    <circle cx="-20" cy="-15" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="20" cy="-15" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="-15" cy="15" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="15" cy="15" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="-20" y1="-15" x2="0" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="-15" x2="0" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="-15" y1="15" x2="0" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="15" y1="15" x2="0" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Subtle border -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
</svg>
